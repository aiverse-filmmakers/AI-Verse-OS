name: Data Natural-Key Routing

on:
  pull_request:
    paths:
      - "scripts/ai_verse_host_adapter.py"
      - "scripts/test-data-natural-key-routing.py"
      - ".github/workflows/data-natural-key-routing.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ai_verse_host_adapter.py"
      - "scripts/test-data-natural-key-routing.py"
      - ".github/workflows/data-natural-key-routing.yml"

permissions:
  contents: read

jobs:
  natural-key-route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile host adapter
        run: python -m py_compile scripts/ai_verse_host_adapter.py scripts/test-data-natural-key-routing.py
      - name: Prove Brain natural key reaches Data owner create
        run: python scripts/test-data-natural-key-routing.py
