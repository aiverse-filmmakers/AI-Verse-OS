name: Capability Placement Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check placement and resolver syntax
        run: |
          node --check scripts/capability-placement.mjs
          node --check scripts/capability-promotion.mjs
          node --check scripts/capability-resolver.mjs
          node --check scripts/capability-resolver-cli.mjs
          node --check scripts/capability-json.mjs
          node --check scripts/member-skill-library.mjs
          node --check scripts/capability-bindings.mjs
          node --check scripts/capability-binding-plan.mjs
          node --check scripts/capability-configuration.mjs
          node --check scripts/capability-configuration-cli.mjs
          node --check scripts/capability-external-sources.mjs

      - name: Test practical placement semantics
        run: node scripts/test-capability-placement.mjs

      - name: Test admitted Workspace-to-personal promotion and compatibility repair
        run: node scripts/test-capability-promotion.mjs

      - name: Regress scoped discovery and managed-generation selection
        run: node scripts/test-capability-resolver.mjs

      - name: Test member library discovery and scoped bindings
        run: |
          node scripts/test-member-skill-library.mjs
          node scripts/test-capability-bindings.mjs
          node scripts/test-member-skills-privacy.mjs

  personal-tool-placement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-personal-tool.mjs
