name: Automatic Learning

on:
  push:
    branches: [main]
    paths:
      - 'scripts/learn-*.mjs'
      - 'scripts/test-learn-*'
      - 'scripts/fixtures/**'
      - 'scripts/ai_verse_learn_apply.py'
      - 'scripts/ai_verse_host_adapter.py'
      - 'scripts/write-command.mjs'
      - 'scripts/action-permission.mjs'
      - 'scripts/operator-profile-owner.mjs'
      - 'scripts/test-write-command.mjs'
      - 'AI-VERSE.yaml'
      - '.claude/skills/learn/**'
      - '.agents/skills/learn/**'
      - 'system/capabilities/learn/**'
      - '.claude/settings.json'
      - '.github/workflows/auto-learning.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve and spawn the claude command without a shell (real claude.cmd shim on Windows)
        run: node scripts/test-learn-claude.mjs
      - name: Test capture (record contract, streaming, secrets across messages, scope, fault injection)
        run: node scripts/test-learn-capture.mjs
      - name: Test the inbox write under kills at every durable step, and withdrawal
        run: node scripts/test-learn-inbox.mjs
      - name: Test the store under competing processes and crashes, and windows
        run: node scripts/test-learn-store.mjs
      - name: Test worker end to end with a fake claude, kill -9 replay, compaction and scopes
        run: node scripts/test-learn-worker.mjs
      - name: Test applier routing and safety
        run: python scripts/test-learn-apply.py
      - name: Check generated runtime adapters are in sync
        run: node scripts/test-adapter-sync.mjs
