name: Repository QC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check architecture and adapter parity
        run: bash scripts/check-architecture.sh

      - name: Test scoped capability discovery and selection
        run: node scripts/test-capability-resolver.mjs

      - name: Test ownership-aware adapter synchronization
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-adapter-sync.mjs
          node scripts/sync-runtime-adapters.mjs
          test -f runtime/adapters/os-owned.json
          test -z "$(git status --porcelain)"

      - name: Validate CLI package metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const cli = fs.readFileSync('bin/ai-verse-os.mjs', 'utf8');

          if (pkg.name !== 'ai-verse-os') throw new Error('package name must be ai-verse-os');
          if (pkg.bin?.['ai-verse-os'] !== 'bin/ai-verse-os.mjs') throw new Error('ai-verse-os bin mapping is missing or wrong');
          if (!cli.includes(`const CLI_VERSION = '${pkg.version}'`)) throw new Error('CLI_VERSION does not match package.json version');
          NODE
          node bin/ai-verse-os.mjs version
          npm pack --dry-run

      - name: Verify member install documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'npx --yes github:aiverse-filmmakers/AI-Verse-OS install' README.md
          grep -Fq 'npm install -g github:aiverse-filmmakers/AI-Verse-OS' README.md
          grep -Fq 'ai-verse-os update' README.md

      - name: Verify local extension registry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.aiverse/extensions/registry.json' AGENTS.md
          grep -Fq '.aiverse/extensions/' .gitignore
          test -f system/extensions/README.md
          mkdir -p .aiverse/extensions
          cat > .aiverse/extensions/registry.json <<'JSON'
          {
            "schema_version": "1.0",
            "extensions": {
              "qc-extension": {
                "id": "qc-extension",
                "supported": true,
                "installed": true,
                "enabled": true
              }
            }
          }
          JSON
          git check-ignore -q .aiverse/extensions/registry.json
          test -z "$(git status --porcelain)"

      - name: Validate canonical 3D Brain package and generated peers
        shell: bash
        run: |
          set -euo pipefail
          node system/capabilities/3d-brain/scripts/test-package.mjs
          test -s docs/media/3d-brain-demo.mp4
          test -s docs/media/3d-brain-preview.gif
          test -f system/capabilities/3d-brain/assets/template/dist/app.js
          test -f .claude/skills/3d-brain/assets/template/dist/app.js
          test -f .agents/skills/3d-brain/assets/template/dist/app.js

      - name: Check for legacy product branding in text
        shell: bash
        run: |
          set -euo pipefail
          legacy_pattern='AIS''-OS|AI''OS|Herk''Brain'
          if git grep -I -n -E "$legacy_pattern" -- . ':(exclude)**/THIRD-PARTY-NOTICES.txt'; then
            echo 'Legacy product branding was found in member-facing text.' >&2
            exit 1
          fi
          echo 'No legacy product branding found in member-facing text.'

  adapter-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current AI-Verse Memory
        shell: bash
        run: |
          set -euo pipefail
          MEMORY="$RUNNER_TEMP/AI-Verse-Memory"
          git clone --depth 1 https://github.com/aiverse-filmmakers/AI-Verse-Memory.git "$MEMORY"
          python "$MEMORY/scripts/install.py" --target "$GITHUB_WORKSPACE" --source-dir "$MEMORY"
          test -f .claude/skills/ai-verse-memory/SKILL.md
          test -f .agents/skills/ai-verse-memory/SKILL.md
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Preserve Memory, custom adapters, and edited Codex files
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_MEMORY_BEFORE="$(sha256sum .claude/skills/ai-verse-memory/SKILL.md | awk '{print $1}')"
          CODEX_MEMORY_BEFORE="$(sha256sum .agents/skills/ai-verse-memory/SKILL.md | awk '{print $1}')"

          mkdir -p .agents/skills/custom-local
          printf '%s\n' 'custom adapter must survive' > .agents/skills/custom-local/SKILL.md

          node scripts/sync-runtime-adapters.mjs
          grep -Fq 'custom adapter must survive' .agents/skills/custom-local/SKILL.md

          printf '%s\n' 'LOCAL CODEX EDIT MUST SURVIVE' >> .agents/skills/onboard/SKILL.md
          set +e
          node scripts/sync-runtime-adapters.mjs > "$RUNNER_TEMP/adapter-sync.out" 2> "$RUNNER_TEMP/adapter-sync.err"
          status=$?
          set -e
          test "$status" -eq 2
          grep -Fq 'locally modified since the last OS generation; preserved' "$RUNNER_TEMP/adapter-sync.err"
          grep -Fq 'LOCAL CODEX EDIT MUST SURVIVE' .agents/skills/onboard/SKILL.md

          CLAUDE_MEMORY_AFTER="$(sha256sum .claude/skills/ai-verse-memory/SKILL.md | awk '{print $1}')"
          CODEX_MEMORY_AFTER="$(sha256sum .agents/skills/ai-verse-memory/SKILL.md | awk '{print $1}')"
          test "$CLAUDE_MEMORY_BEFORE" = "$CLAUDE_MEMORY_AFTER"
          test "$CODEX_MEMORY_BEFORE" = "$CODEX_MEMORY_AFTER"
          grep -Fq 'custom adapter must survive' .agents/skills/custom-local/SKILL.md

          git checkout -- .agents/skills/onboard/SKILL.md
          node scripts/sync-runtime-adapters.mjs
          test -z "$(git status --porcelain --untracked-files=no)"

  skills-provider-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Provider-v1 Skills generation outside OS
        shell: bash
        env:
          SKILLS_COMMIT: 5b31d06e307455557f1e5000df68672a56d73e46
        run: |
          set -euo pipefail
          SKILLS_REPO="$RUNNER_TEMP/AI-Verse-Skills"
          SKILLS_ROOT="$RUNNER_TEMP/aiverse-skills-root"
          CACHE_ROOT="$RUNNER_TEMP/aiverse-skills-cache"
          git clone https://github.com/aiverse-filmmakers/AI-Verse-Skills.git "$SKILLS_REPO"
          git -C "$SKILLS_REPO" checkout --detach "$SKILLS_COMMIT"
          python "$SKILLS_REPO/installer/aiverse_skills.py" \
            --root "$SKILLS_ROOT" \
            --cache "$CACHE_ROOT" \
            install --profile creator
          printf '%s' "$SKILLS_ROOT" > "$RUNNER_TEMP/skills-root.txt"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Discover and select from the real immutable provider
        shell: bash
        run: |
          set -euo pipefail
          export SKILLS_ROOT="$(cat "$RUNNER_TEMP/skills-root.txt")"
          export LOCAL_ROOT="$RUNNER_TEMP/no-local-skills"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { discoverCapabilities, selectCapability } from './scripts/capability-resolver.mjs';

          const options = {
            osRoot: process.cwd(),
            scope: 'operator',
            skillsRoot: process.env.SKILLS_ROOT,
            localSkillsRoot: process.env.LOCAL_ROOT,
          };
          const discovered = discoverCapabilities({ ...options, query: 'whisper', limit: 1 });
          const provider = discovered.providers.find((item) => item.provider === 'aiverse-skills');
          assert.equal(provider.state, 'healthy');
          assert.equal(discovered.candidates.length, 1);
          assert.equal(discovered.candidates[0].id, 'aiverse-skills:whisper');
          assert.equal(discovered.candidates[0].readiness, 'UNVERIFIED');

          const selected = selectCapability({ ...options, qualifiedId: 'aiverse-skills:whisper' });
          assert.equal(selected.status, 'selected');
          assert.equal(selected.selection.id, 'aiverse-skills:whisper');
          assert.equal(selected.selection.generation_id, provider.generation_id);
          assert.equal(selected.selection.digest.algorithm, 'aiverse-package-sha256-v1');
          console.log('Real Skills provider discovery: PASS');
          NODE
          test -z "$(git status --porcelain --untracked-files=no)"
