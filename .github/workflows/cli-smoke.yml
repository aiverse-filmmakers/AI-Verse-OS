name: CLI smoke test

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/cli-smoke.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/cli-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-manage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CLI globally
        run: npm install -g .

      - name: Check CLI
        run: |
          ai-verse-os version
          ai-verse-os doctor --dir .

      - name: Test fresh install
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/AI-Verse-OS-test"
          rm -rf "$TARGET"
          ai-verse-os install --dir "$TARGET"
          test -f "$TARGET/AI-VERSE.yaml"
          test -f "$TARGET/.claude/skills/onboard/SKILL.md"
          test -f "$TARGET/.agents/skills/onboard/SKILL.md"
          ai-verse-os doctor --dir "$TARGET"
          ai-verse-os update --dir "$TARGET"
