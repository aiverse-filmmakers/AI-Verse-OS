name: Repository QC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check architecture and adapter parity
        run: bash scripts/check-architecture.sh

      - name: Test UTF-8 host adapter subprocess boundaries
        run: python3 scripts/test-host-adapter-utf8.py

      - name: Test progressive Memory host bridge contract
        run: python3 scripts/test-progressive-history-bridge.py

      - name: Test Claude transcript JSONL fixture parser
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_claude_transcript.py' -v

      - name: Test prospective-only Codex hook-field observer (synthetic, capture disabled)
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_capture.py' -v

      - name: Test Codex App Server v2 source coverage candidate (pure synthetic, no host IO)
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_app_server_candidate.py' -v

      - name: Test OS-owned App Server stdio boundary with private synthetic child only
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_app_server_transport.py' -v

      - name: Test OS-owned App Server synthetic consent and scope policy, production blocked
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_app_server_trust_policy.py' -v

      - name: Test OS-originated thread and turn request binding with private synthetic child only
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_app_server_thread_binding.py' -v

      - name: Test exact synthetic Codex App Server JSONL source wire evidence without v1 admission
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_app_server_source_evidence.py' -v

      - name: Test v2 synthetic Codex received-wire archive envelope without persistence
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_app_server_archive_v2.py' -v

      - name: Test pinned-schema shape and hard-disabled Codex capture (synthetic only)
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_host_schema_pin.py' -v

      - name: Test nonlaunching Codex runtime candidate file preflight (synthetic-only)
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_app_server_runtime_preflight.py' -v

      - name: Test OS private portable chat archive fixtures
        run: |
          python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_chat_archive.py' -v
          git check-ignore -q archives/private-chat-history/v1/operator/synthetic-chat.jsonl

      - name: Test scoped capability discovery and selection
        run: node scripts/test-capability-resolver.mjs

      - name: Test read-only accepted OS/Core version report
        run: |
          node scripts/test-os-version.mjs
          node scripts/test-os-version-truth.mjs

      - name: Test public-beta component lifecycle and reconciliation
        run: node scripts/test-components.mjs

      - name: Test public-beta OS lifecycle state machine
        run: node scripts/test-cli-lifecycle.mjs

      - name: Test progressive onboarding contract
        run: node scripts/test-progressive-onboarding.mjs

      - name: Test automatic workspace owner primitive
        run: node scripts/test-workspace-owner.mjs

      - name: Test automatic migration-drop owner routing
        run: |
          python3 -m py_compile scripts/ai_verse_host_adapter.py scripts/migration-import.py scripts/test-semantic-migration-clarification.py
          node --check scripts/operator-profile-owner.mjs
          node scripts/test-operator-profile-owner.mjs
          python3 scripts/test-migration-import.py
          python3 scripts/test-semantic-migration-clarification.py

      - name: Test ownership-aware adapter synchronization
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-adapter-sync.mjs
          node scripts/sync-runtime-adapters.mjs
          test -f runtime/adapters/os-owned.json
          test -z "$(git status --porcelain)"

      - name: Validate CLI package metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const cli = fs.readFileSync('bin/ai-verse-os.mjs', 'utf8');

          if (pkg.name !== 'ai-verse-os') throw new Error('package name must be ai-verse-os');
          if (pkg.bin?.['ai-verse-os'] !== 'bin/ai-verse-os.mjs') throw new Error('ai-verse-os bin mapping is missing or wrong');
          const desc = JSON.parse(fs.readFileSync('release/component-release.json', 'utf8'));
          if (cli.includes("CLI_VERSION = '")) throw new Error('CLI must read its version from release/component-release.json, not hard-code it');
          if (!pkg.files.includes('release/component-release.json')) throw new Error('package must ship release/component-release.json');
          if (!desc.version) throw new Error('release descriptor has no version');
          NODE
          node bin/ai-verse-os.mjs version
          npm pack --dry-run

      - name: Verify member install documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'npx --yes github:aiverse-filmmakers/AI-Verse-OS install' README.md
          grep -Fq 'npm install -g github:aiverse-filmmakers/AI-Verse-OS' README.md
          grep -Fq 'ai-verse-os update' README.md
          grep -Fq '## Install' README.md
          grep -Fq '## Setup' README.md
          grep -Fq '## Verify' README.md
          grep -Fq '## Use' README.md
          grep -Fq '## Update / disable / uninstall' README.md
          grep -Fq '## What setup grants / does not grant' README.md

      - name: Verify local extension registry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.aiverse/extensions/registry.json' AGENTS.md
          grep -Fq '.aiverse/extensions/' .gitignore
          grep -Fq '.aiverse/os/' .gitignore
          test -f system/extensions/README.md
          mkdir -p .aiverse/extensions
          cat > .aiverse/extensions/registry.json <<'JSON'
          {
            "schema_version": "1.0",
            "extensions": {
              "qc-extension": {
                "id": "qc-extension",
                "supported": true,
                "installed": true,
                "enabled": true
              }
            }
          }
          JSON
          git check-ignore -q .aiverse/extensions/registry.json
          test -z "$(git status --porcelain)"

      - name: Validate canonical 3D Brain package and generated peers
        shell: bash
        run: |
          set -euo pipefail
          node system/capabilities/3d-brain/scripts/test-package.mjs
          test -s docs/media/3d-brain-demo.mp4
          test -s docs/media/3d-brain-preview.gif
          test -f system/capabilities/3d-brain/assets/template/dist/app.js
          test -f .claude/skills/3d-brain/assets/template/dist/app.js
          test -f .agents/skills/3d-brain/assets/template/dist/app.js

      - name: Check for legacy product branding in text
        shell: bash
        run: |
          set -euo pipefail
          legacy_pattern='AIS''-OS|AI''OS|Herk''Brain'
          if git grep -I -n -E "$legacy_pattern" -- . ':(exclude)**/THIRD-PARTY-NOTICES.txt'; then
            echo 'Legacy product branding was found in member-facing text.' >&2
            exit 1
          fi
          echo 'No legacy product branding found in member-facing text.'

  adapter-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current AI-Verse Memory
        shell: bash
        run: |
          set -euo pipefail
          MEMORY="$RUNNER_TEMP/AI-Verse-Memory"
          git clone --depth 1 https://github.com/aiverse-filmmakers/AI-Verse-Memory.git "$MEMORY"
          python "$MEMORY/scripts/install.py" --target "$GITHUB_WORKSPACE" --source-dir "$MEMORY"
          test -f .claude/skills/ai-verse-memory/SKILL.md
          test -f .agents/skills/ai-verse-memory/SKILL.md
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Preserve Memory, custom adapters, and edited Codex files
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_MEMORY_BEFORE="$(sha256sum .claude/skills/ai-verse-memory/SKILL.md | awk '{print $1}')"
          CODEX_MEMORY_BEFORE="$(sha256sum .agents/skills/ai-verse-memory/SKILL.md | awk '{print $1}')"

          mkdir -p .agents/skills/custom-local
          printf '%s\n' 'custom adapter must survive' > .agents/skills/custom-local/SKILL.md

          node scripts/sync-runtime-adapters.mjs
          grep -Fq 'custom adapter must survive' .agents/skills/custom-local/SKILL.md

          printf '%s\n' 'LOCAL CODEX EDIT MUST SURVIVE' >> .agents/skills/onboard/SKILL.md
          set +e
          node scripts/sync-runtime-adapters.mjs > "$RUNNER_TEMP/adapter-sync.out" 2> "$RUNNER_TEMP/adapter-sync.err"
          status=$?
          set -e
          test "$status" -eq 2
          grep -Fq 'locally modified since the last OS generation; preserved' "$RUNNER_TEMP/adapter-sync.err"
          grep -Fq 'LOCAL CODEX EDIT MUST SURVIVE' .agents/skills/onboard/SKILL.md

          CLAUDE_MEMORY_AFTER="$(sha256sum .claude/skills/ai-verse-memory/SKILL.md | awk '{print $1}')"
          CODEX_MEMORY_AFTER="$(sha256sum .agents/skills/ai-verse-memory/SKILL.md | awk '{print $1}')"
          test "$CLAUDE_MEMORY_BEFORE" = "$CLAUDE_MEMORY_AFTER"
          test "$CODEX_MEMORY_BEFORE" = "$CODEX_MEMORY_AFTER"
          grep -Fq 'custom adapter must survive' .agents/skills/custom-local/SKILL.md

          git checkout -- .agents/skills/onboard/SKILL.md
          node scripts/sync-runtime-adapters.mjs
          test -z "$(git status --porcelain --untracked-files=no)"

  skills-provider-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Provider-v1 Skills generation outside OS
        shell: bash
        env:
          SKILLS_COMMIT: 5b31d06e307455557f1e5000df68672a56d73e46
        run: |
          set -euo pipefail
          SKILLS_REPO="$RUNNER_TEMP/AI-Verse-Skills"
          SKILLS_ROOT="$RUNNER_TEMP/aiverse-skills-root"
          CACHE_ROOT="$RUNNER_TEMP/aiverse-skills-cache"
          git clone https://github.com/aiverse-filmmakers/AI-Verse-Skills.git "$SKILLS_REPO"
          git -C "$SKILLS_REPO" checkout --detach "$SKILLS_COMMIT"
          python "$SKILLS_REPO/installer/aiverse_skills.py" \
            --root "$SKILLS_ROOT" \
            --cache "$CACHE_ROOT" \
            install --profile creator
          printf '%s' "$SKILLS_ROOT" > "$RUNNER_TEMP/skills-root.txt"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Discover and select from the real immutable provider
        shell: bash
        run: |
          set -euo pipefail
          export SKILLS_ROOT="$(cat "$RUNNER_TEMP/skills-root.txt")"
          export LOCAL_ROOT="$RUNNER_TEMP/no-local-skills"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { discoverCapabilities, selectCapability } from './scripts/capability-resolver.mjs';

          const options = {
            osRoot: process.cwd(),
            scope: 'operator',
            skillsRoot: process.env.SKILLS_ROOT,
            localSkillsRoot: process.env.LOCAL_ROOT,
          };
          const discovered = discoverCapabilities({ ...options, query: 'whisper', limit: 1 });
          const provider = discovered.providers.find((item) => item.provider === 'aiverse-skills');
          assert.equal(provider.state, 'healthy');
          assert.equal(discovered.candidates.length, 1);
          assert.equal(discovered.candidates[0].id, 'aiverse-skills:whisper');
          assert.equal(discovered.candidates[0].readiness, 'UNVERIFIED');

          const selected = selectCapability({ ...options, qualifiedId: 'aiverse-skills:whisper' });
          assert.equal(selected.status, 'selected');
          assert.equal(selected.selection.id, 'aiverse-skills:whisper');
          assert.equal(selected.selection.generation_id, provider.generation_id);
          assert.equal(selected.selection.digest.algorithm, 'aiverse-package-sha256-v1');
          console.log('Real Skills provider discovery: PASS');
          NODE
          test -z "$(git status --porcelain --untracked-files=no)"

  codex-upstream-schema-pin:
    name: Exact upstream Codex generated v2 schema, read-only pinned checkout
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream Codex source at immutable commit (no execution)
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: e54a5713caf331f42a6eef0166186df5f7563c29
          path: pinned-codex
          sparse-checkout: |
            codex-rs/app-server-protocol/schema/json/v2/ThreadStartParams.json
            codex-rs/app-server-protocol/schema/json/v2/ThreadStartResponse.json
            codex-rs/app-server-protocol/schema/json/v2/TurnStartParams.json
            codex-rs/app-server-protocol/schema/json/v2/TurnStartResponse.json
            codex-rs/app-server-protocol/schema/json/v2/ItemStartedNotification.json
            codex-rs/app-server-protocol/schema/json/v2/ItemCompletedNotification.json
            codex-rs/app-server-protocol/schema/json/v2/TurnCompletedNotification.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify exact source commit and generated blob identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-codex rev-parse HEAD)" = "e54a5713caf331f42a6eef0166186df5f7563c29"
          test -f pinned-codex/codex-rs/app-server-protocol/schema/json/v2/ItemCompletedNotification.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source schema structure and deny real-host admission
        env:
          AI_VERSE_PINNED_CODEX_V2_SCHEMA_DIR: ${{ github.workspace }}/pinned-codex/codex-rs/app-server-protocol/schema/json/v2
        run: python3 -m unittest discover -s system/extensions/tests/codex-learning -p 'test_codex_host_schema_pin.py' -v

