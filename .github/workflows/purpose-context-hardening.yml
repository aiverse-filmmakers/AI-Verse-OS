name: Purpose Context Hardening

on:
  pull_request:
    paths:
      - 'scripts/purpose-*.mjs'
      - 'scripts/test-purpose-context-hardening.mjs'
      - 'scripts/test-purpose-context-security-hardening.mjs'
      - 'scripts/test-purpose-context-semantic-acceptance.mjs'
      - 'scripts/test-purpose-context-semantic-acceptance-events.mjs'
      - 'scripts/test-purpose-data-current-state.mjs'
      - 'scripts/*purpose-reader.mjs'
      - 'scripts/test-purpose-context-cli-data.mjs'
      - 'scripts/test-brain-purpose-reader.mjs'
      - 'scripts/test-purpose-data-source-descent.mjs'
      - 'scripts/test-purpose-memory-history-boundary.mjs'
      - 'scripts/test-action-permission.mjs'
      - '.github/workflows/purpose-context-hardening.yml'
      - 'system/architecture/purpose-context.md'
      - 'system/schemas/purpose-context.schema.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Purpose Context rebuildability hardening proofs
        run: node scripts/test-purpose-context-hardening.mjs
      - name: Run explicit Brain and Data Purpose reader proofs
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          node scripts/test-brain-purpose-reader.mjs
          node scripts/test-purpose-context-cli-data.mjs
      - name: Run Purpose Context security hardening proofs
        run: node scripts/test-purpose-context-security-hardening.mjs
      - name: Run Data and Memory scope boundary proofs
        run: |
          node scripts/test-purpose-data-current-state.mjs
          node scripts/test-purpose-memory-history-boundary.mjs
      - name: Run exact-source permission descent proof
        run: node scripts/test-purpose-data-source-descent.mjs
      - name: Run canonical action permission boundary
        run: node scripts/test-action-permission.mjs
      - name: Run Purpose semantic acceptance scenarios
        run: |
          node scripts/test-purpose-context-semantic-acceptance.mjs
          node scripts/test-purpose-context-semantic-acceptance-events.mjs
