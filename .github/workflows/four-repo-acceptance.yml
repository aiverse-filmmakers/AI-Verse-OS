name: Four Repo Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-repo-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEMORY_COMMIT: f564d39260b7b8ddc32a607ab1b5650fe6638f4e
      BRAIN_COMMIT: 2a4a78dd5d0b08ffa2d1cd9a84cdfed697fa6de8
      SKILLS_COMMIT: 558bbcb05ce9f42bb5be30730ea205a7e791bf86

    steps:
      - name: Checkout AI-Verse OS under test
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lock exact audited revisions
        shell: bash
        run: |
          set -euo pipefail
          MEMORY="$RUNNER_TEMP/AI-Verse-Memory"
          BRAIN="$RUNNER_TEMP/AI-Verse-Brain"
          SKILLS="$RUNNER_TEMP/AI-Verse-Skills"

          git clone https://github.com/aiverse-filmmakers/AI-Verse-Memory.git "$MEMORY"
          git -C "$MEMORY" checkout --detach "$MEMORY_COMMIT"
          test "$(git -C "$MEMORY" rev-parse HEAD)" = "$MEMORY_COMMIT"

          git clone https://github.com/aiverse-filmmakers/AI-Verse-Brain.git "$BRAIN"
          git -C "$BRAIN" checkout --detach "$BRAIN_COMMIT"
          test "$(git -C "$BRAIN" rev-parse HEAD)" = "$BRAIN_COMMIT"

          git clone https://github.com/aiverse-filmmakers/AI-Verse-Skills.git "$SKILLS"
          git -C "$SKILLS" checkout --detach "$SKILLS_COMMIT"
          test "$(git -C "$SKILLS" rev-parse HEAD)" = "$SKILLS_COMMIT"

          printf '%s' "$MEMORY" > "$RUNNER_TEMP/memory-repo.txt"
          printf '%s' "$BRAIN" > "$RUNNER_TEMP/brain-repo.txt"
          printf '%s' "$SKILLS" > "$RUNNER_TEMP/skills-repo.txt"
          printf 'OS=%s\nMemory=%s\nBrain=%s\nSkills=%s\n' \
            "$(git rev-parse HEAD)" "$MEMORY_COMMIT" "$BRAIN_COMMIT" "$SKILLS_COMMIT"

      - name: Compose Memory natively without dirtying OS
        shell: bash
        run: |
          set -euo pipefail
          MEMORY="$(cat "$RUNNER_TEMP/memory-repo.txt")"
          python "$MEMORY/scripts/install.py" --target "$GITHUB_WORKSPACE" --source-dir "$MEMORY"
          test -f scripts/ai-verse-memory/memory.py
          test -f scripts/ai-verse-memory/memory_engine.py
          test -f .claude/skills/ai-verse-memory/SKILL.md
          test -f .agents/skills/ai-verse-memory/SKILL.md
          test -f .aiverse/extensions/registry.json
          grep -Fq 'ai-verse-memory' .aiverse/extensions/registry.json
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Register and initialize Brain under the OS contract
        shell: bash
        run: |
          set -euo pipefail
          BRAIN="$(cat "$RUNNER_TEMP/brain-repo.txt")"
          python -m pip install -e "$BRAIN"
          python - <<'PY'
          from pathlib import Path

          manifest = Path('AI-VERSE.yaml')
          text = manifest.read_text(encoding='utf-8')
          needle = 'extensions:\n'
          if needle not in text:
              raise SystemExit('extensions section missing')
          replacement = (
              'extensions:\n'
              '  brain:\n'
              '    supported: true\n'
              '    enabled: true\n'
          )
          manifest.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          python - <<'PY'
          from aiverse_brain.installation import initialize, read_installation_marker
          initialize('.')
          marker = read_installation_marker('.')
          assert marker is not None
          print('Brain native initialization: PASS')
          PY

      - name: Install Skills externally and prove OS provider discovery
        shell: bash
        run: |
          set -euo pipefail
          SKILLS="$(cat "$RUNNER_TEMP/skills-repo.txt")"
          SKILLS_ROOT="$RUNNER_TEMP/aiverse-skills-root"
          CACHE_ROOT="$RUNNER_TEMP/aiverse-skills-cache"
          python "$SKILLS/installer/aiverse_skills.py" \
            --root "$SKILLS_ROOT" \
            --cache "$CACHE_ROOT" \
            install --profile creator
          printf '%s' "$SKILLS_ROOT" > "$RUNNER_TEMP/skills-root.txt"

          SKILLS_ROOT="$SKILLS_ROOT" CAPABILITIES_JSON="$RUNNER_TEMP/capabilities.json" \
          PROVIDERS_JSON="$RUNNER_TEMP/providers.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { discoverCapabilities, selectCapability } from './scripts/capability-resolver.mjs';

          const options = {
            osRoot: process.cwd(),
            scope: 'operator',
            skillsRoot: process.env.SKILLS_ROOT,
            localSkillsRoot: `${process.env.RUNNER_TEMP}/no-local-skills`,
          };
          const discovered = discoverCapabilities({
            ...options,
            query: 'Aurora release whisper audio transcode dialogue delivery',
            limit: 50,
          });
          const provider = discovered.providers.find((item) => item.provider === 'aiverse-skills');
          assert.equal(provider?.state, 'healthy');
          const whisper = discovered.candidates.find((item) => item.id === 'aiverse-skills:whisper');
          assert.ok(whisper, 'real Skills provider did not expose whisper');
          const selected = selectCapability({ ...options, qualifiedId: 'aiverse-skills:whisper' });
          assert.equal(selected.status, 'selected');
          assert.equal(selected.selection.generation_id, provider.generation_id);
          assert.equal(selected.selection.digest.algorithm, 'aiverse-package-sha256-v1');
          fs.writeFileSync(process.env.CAPABILITIES_JSON, JSON.stringify(discovered.candidates, null, 2));
          fs.writeFileSync(process.env.PROVIDERS_JSON, JSON.stringify(discovered.providers, null, 2));
          console.log('OS x Skills provider discovery: PASS');
          NODE

          test ! -e skills/imported/ai-verse/whisper
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M AI-VERSE.yaml$' || true)"

      - name: Prove all-four runtime data flow in one OS checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p operator/context
          cat > operator/context/CURRENT.md <<'EOF'
          # Current Context

          ## Current priorities

          - Ship the Aurora release after whisper dialogue transcription and transcode validation.
          EOF

          python scripts/ai-verse-memory/memory.py --root . remember \
            --type experience \
            --scope operator \
            --source final-four-repo-acceptance \
            --text 'Aurora release prerequisite: transcode dialogue with whisper before delivery'

          CAPABILITIES_JSON="$RUNNER_TEMP/capabilities.json" python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          from aiverse_brain import BrainRuntime, Scope
          from aiverse_brain.cadence import Trigger
          from aiverse_brain.direction_ownership import DirectionOwnershipService
          from aiverse_brain.tick_output import build_tick_summary
          from aiverse_brain.host_selection import HostSelection

          ROOT = Path.cwd()
          CAPABILITIES = json.loads(Path(os.environ['CAPABILITIES_JSON']).read_text(encoding='utf-8'))

          engine_path = ROOT / 'scripts' / 'ai-verse-memory' / 'memory_engine.py'
          spec = importlib.util.spec_from_file_location('four_repo_memory_engine', engine_path)
          memory = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(memory)
          memory_mode = memory.detect_mode(ROOT)

          class FourRepoHost:
              def __init__(self):
                  self.action_calls = 0
                  self.notifications = 0

              def read_context(self, scope):
                  return {
                      'scope': scope,
                      'current_context': (ROOT / 'operator/context/CURRENT.md').read_text(encoding='utf-8'),
                  }

              def retrieve_history(self, query, scope):
                  rows = memory.recall(query, scope=scope, limit=12, root=ROOT, mode=memory_mode)
                  return [dict(row) for row in rows]

              def list_capabilities(self, scope):
                  return list(CAPABILITIES)

              def list_connections(self, scope):
                  return []

              def request_action(self, request):
                  self.action_calls += 1
                  raise AssertionError('cognition acceptance must not dispatch host actions')

              def request_evaluation(self, request):
                  return {}

              def schedule_trigger(self, trigger):
                  return {}

              def cancel_trigger(self, trigger_id):
                  return None

              def notify_user(self, notification):
                  self.notifications += 1
                  raise AssertionError('runtime must not notify implicitly')

              def write_route(self, classification, payload, scope):
                  return None

          class CaptureReasoner:
              model_id = 'four-repo-capture'

              def __init__(self):
                  self.contexts = []

              def reason(self, request, context):
                  self.contexts.append((request, context))
                  return {'proposals': []}

          runtime = BrainRuntime(str(ROOT))
          ownership = DirectionOwnershipService(runtime.controller)
          assert ownership.owner('operator') == 'os'
          handover = ownership.handover('operator', confirm_import=True)
          assert handover.owner == 'brain'
          assert handover.state == 'active'
          assert len(handover.brain_refs) == 1
          goal_id = handover.brain_refs[0].split('brain:intent:', 1)[1]
          goal = runtime.controller.store.load('intent', 'operator', goal_id)
          assert goal.status == 'CONFIRMED'
          assert 'Aurora release' in goal.payload['statement']

          host = FourRepoHost()
          reasoner = CaptureReasoner()
          result = runtime.run_tick(
              Trigger('scheduled_orientation', Scope('operator'), 'final-four-repo-runtime'),
              host=host,
              reasoner=reasoner,
              session_id='final-four-repo-acceptance',
          )
          assert result.ok, result.errors
          assert result.reasoner_calls == 2
          assert len(reasoner.contexts) == 2
          assert host.action_calls == 0
          assert host.notifications == 0

          history_contexts = [ctx for _, ctx in reasoner.contexts if ctx.get('history')]
          assert history_contexts, 'Brain did not retrieve Memory history for gap analysis'
          history_rows = [row for ctx in history_contexts for row in ctx['history']]
          matched_history = [
              row for row in history_rows
              if 'Aurora release prerequisite' in str(row.get('text', ''))
          ]
          assert matched_history, 'Brain history context did not contain the real Memory record'
          assert any(row.get('source_identity') for row in matched_history)
          assert any(row.get('source_version') for row in matched_history)
          assert all(row.get('freshness') in {'historical', 'fresh'} for row in matched_history)

          capability_contexts = [ctx for _, ctx in reasoner.contexts if ctx.get('capabilities')]
          assert capability_contexts, 'Brain did not receive OS-discovered Skills capabilities'
          capability_rows = [row for ctx in capability_contexts for row in ctx['capabilities']]
          whisper = next((row for row in capability_rows if row.get('id') == 'aiverse-skills:whisper'), None)
          assert whisper is not None, 'Brain capability ranking lost the real whisper capability'
          assert whisper.get('generation_id'), whisper
          assert whisper.get('digest', {}).get('algorithm') == 'aiverse-package-sha256-v1'

          retrieval_queries = [ctx.get('retrieval_queries', {}) for _, ctx in reasoner.contexts]
          joined_queries = json.dumps(retrieval_queries).lower()
          assert 'aurora' in joined_queries
          assert 'whisper' in joined_queries
          assert 'gap_analysis' not in joined_queries

          selection = HostSelection(
              host=host,
              mode='four-repo-host',
              real_host=True,
              adapter_id='acceptance:os-memory-skills',
              operations=('read_context', 'retrieve_history', 'list_capabilities', 'list_connections'),
          )
          summary = build_tick_summary(result, selection, runtime)
          assert summary['orientation']['mode'] == 'deterministic'
          assert summary['orientation']['direction_owner'] == 'brain'
          assert summary['orientation']['state']['goals']['total'] >= 1
          assert any(item.get('id') == goal.id for item in summary['orientation']['state']['goals']['items'])
          assert summary['reasoner_calls'] == 2

          print('OS direction handover x Memory x Brain x Skills runtime data flow: PASS')
          PY

      - name: Prove Memory scope isolation survives full composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspaces/alpha/context workspaces/beta/context
          cat > workspaces/alpha/WORKSPACE.yaml <<'EOF'
          schema_version: "1.0"
          id: alpha
          name: Alpha
          EOF
          cat > workspaces/beta/WORKSPACE.yaml <<'EOF'
          schema_version: "1.0"
          id: beta
          name: Beta
          EOF
          python scripts/ai-verse-memory/memory.py --root . remember \
            --type state --workspace alpha --text 'alpha-only-final-matrix-secret'
          python scripts/ai-verse-memory/memory.py --root . remember \
            --type state --workspace beta --text 'beta-only-final-matrix-secret'
          python scripts/ai-verse-memory/memory.py --root . recall 'alpha-only-final-matrix-secret' --workspace beta > "$RUNNER_TEMP/beta-recall.txt"
          if grep -Fq 'alpha-only-final-matrix-secret' "$RUNNER_TEMP/beta-recall.txt"; then
            echo 'cross-workspace Memory leak detected' >&2
            exit 1
          fi
          python scripts/ai-verse-memory/memory.py --root . recall 'alpha-only-final-matrix-secret' --workspace alpha > "$RUNNER_TEMP/alpha-recall.txt"
          grep -Fq 'alpha-only-final-matrix-secret' "$RUNNER_TEMP/alpha-recall.txt"
          echo 'Memory workspace isolation under full composition: PASS'

      - name: Prove OS and Brain permission intersection with current Brain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          from aiverse_brain.action_boundary import ActionExecutor, ActionRequest
          from aiverse_brain.errors import PermissionDenied
          from aiverse_brain.models import Scope
          from aiverse_brain.policy import BrainPolicy

          ROOT = Path.cwd()
          POLICY = ROOT / 'automations' / 'policies' / 'action-permissions.yaml'
          POLICY.parent.mkdir(parents=True, exist_ok=True)
          POLICY.write_text(
              'schema_version: "1.0"\n'
              'approval:\n'
              '  external_actions: "deny"\n'
              '  destructive_actions: "deny"\n'
              '  high_stakes_decisions: "deny"\n',
              encoding='utf-8',
          )

          class OSHost:
              action_calls = 0
              def authorize_action(self, request):
                  proc = subprocess.run(
                      ['node', 'scripts/action-permission.mjs', '--root', str(ROOT)],
                      input=json.dumps(request), text=True, capture_output=True, check=True,
                  )
                  return json.loads(proc.stdout)
              def request_action(self, request):
                  self.action_calls += 1
                  return {'status': 'succeeded', 'effect_occurred': True, 'result': {}}

          policy = BrainPolicy()
          policy.action_policy['send_message'] = 'allow_within_scope'
          request = ActionRequest(
              action_class='send_message', scope=Scope('operator'), operation='send',
              parameters={'to': 'contract@example.test', 'body': 'final matrix'},
              idempotency_key='final-four-repo-permission', in_scope=True,
              within_budget=True, reversible=True, reason='final acceptance',
          )
          host = OSHost()
          try:
              ActionExecutor(ROOT, policy).execute(request, host, host_idempotency_supported=True)
          except PermissionDenied:
              pass
          else:
              raise AssertionError('OS deny did not override Brain allow')
          assert host.action_calls == 0
          print('OS x Brain restrictive permission intersection: PASS')
          PY

      - name: Final ownership and cleanliness assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f .aiverse/extensions/registry.json
          grep -Fq 'ai-verse-memory' .aiverse/extensions/registry.json
          test -d "$(cat "$RUNNER_TEMP/skills-root.txt")/.aiverse/generations"
          test ! -d .aiverse/skills
          git checkout -- AI-VERSE.yaml
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'Final four-repo acceptance matrix: PASS'
