name: WSA-2026-053 Branch Patch

on:
  push:
    branches:
      - repair/wsa-2026-053-data-natural-key-adoption

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/wsa-2026-053-data-natural-key-adoption
          fetch-depth: 0
      - name: Adopt Data owner natural-key boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/ai_verse_host_adapter.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'^(?P<indent>[ \t]+)"idempotencyKey": self\._auto_data_key\(candidate_id, "record-create"\),\n'
              r'(?P=indent)"data": dict\(record_data\),$',
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) == 1:
              def add_natural_key(match):
                  indent = match.group("indent")
                  return (
                      match.group(0)
                      + "\n" + indent + '"naturalKey": {'
                      + "\n" + indent + '    "field": match_field,'
                      + "\n" + indent + '    "value": match.get("value"),'
                      + "\n" + indent + '},'
                  )
              text = pattern.sub(add_natural_key, text, count=1)
              path.write_text(text, encoding="utf-8")
          elif len(matches) == 0 and '"naturalKey": {' in text:
              pass
          else:
              raise SystemExit(f"expected exactly one Data record-create payload, found {len(matches)}")
          PY
          if git diff --quiet -- scripts/ai_verse_host_adapter.py; then
            echo "Adapter already contains the natural-key adoption."
            exit 0
          fi
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add scripts/ai_verse_host_adapter.py
          git commit -m "Route automatic Data creates through owner natural-key admission"
          git push origin HEAD:repair/wsa-2026-053-data-natural-key-adoption
