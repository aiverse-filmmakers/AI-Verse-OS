name: Workspace Infrastructure Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Workspace infrastructure detector syntax
        run: node --check scripts/workspace-infrastructure.mjs

      - name: Test existing Workspace owner primitive
        run: node scripts/test-workspace-owner.mjs

      - name: Test Workspace infrastructure generation and fail-closed behavior
        run: node scripts/test-workspace-infrastructure.mjs

      - name: Verify tests did not mutate the checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
