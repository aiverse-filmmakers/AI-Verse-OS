name: Validate restored 3D Brain

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify original full package is present
        shell: bash
        run: |
          set -euo pipefail
          test -f .claude/skills/3d-brain/assets/template/dist/app.js
          test -f .claude/skills/3d-brain/assets/template/src/app.js
          test -f .claude/skills/3d-brain/assets/template/src/constellation.js
          test -f .claude/skills/3d-brain/assets/template/src/growth.js
          test -f .claude/skills/3d-brain/assets/template/THIRD-PARTY-NOTICES.txt
          test -f docs/media/3d-brain-demo.mp4
          test -f docs/media/3d-brain-preview.gif
          test ! -f .claude/skills/3d-brain/assets/template/app.js
          diff -qr .claude/skills/3d-brain .agents/skills/3d-brain

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          cd .claude/skills/3d-brain
          node scripts/test-package.mjs

      - name: Check AI-Verse rebrand in text package
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --binary-files=without-match 'AIS-OS|\bAIOS\b' .claude/skills/3d-brain .agents/skills/3d-brain docs/media --exclude='THIRD-PARTY-NOTICES.txt'; then
            echo 'Old product branding remains in restored text files.'
            exit 1
          fi

      - name: Remove one-shot validation files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-restored-3d-brain.yml
          rm -f .github/validate-restored-3d-brain-trigger.txt
          git config user.name "AI-VERSE"
          git config user.email "hello@bogdanpascal.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete restored 3D Brain validation"
            git push origin HEAD:main
          fi
