name: Temporary WSA-2026-052 Repair Validation

on:
  push:
    branches:
      - repair/wsa-2026-052-source-concurrency
    paths:
      - ".github/workflows/_wsa-2026-052-patch.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile migration host and tests
        run: |
          python -m py_compile scripts/ai_verse_host_adapter.py scripts/test-migration-import.py scripts/test-semantic-migration-clarification.py scripts/test-migration-source-concurrency.py
      - name: Run existing migration regressions
        run: |
          python scripts/test-migration-import.py
          python scripts/test-semantic-migration-clarification.py
      - name: Run WSA-2026-052 concurrency regressions
        run: python scripts/test-migration-source-concurrency.py
