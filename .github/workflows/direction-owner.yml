name: Direction Ownership

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  direction-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed per-scope direction ownership
        run: node scripts/test-direction-owner.mjs
      - name: Test ownership-aware active current context
        run: node scripts/test-current-context.mjs
      - name: Test Purpose Context ownership-aware reads
        run: node scripts/test-purpose-context.mjs
      - name: Test Purpose Context v1 envelope
        run: node scripts/test-purpose-context-envelope.mjs
      - name: Test Purpose Context v1 no-cache behavior
        run: node scripts/test-purpose-context-no-cache.mjs
      - name: Test Purpose Context v1 fail-closed owner behavior
        run: node scripts/test-purpose-context-fail-closed.mjs
      - name: Test Purpose Context v1 delete/rebuild/restart stability
        run: node scripts/test-purpose-context-rebuild.mjs
      - name: Test Purpose Context workspace profile behavior
        run: node scripts/test-purpose-context-profiles.mjs
      - name: Test Purpose Context explicit scope relationships
        run: node scripts/test-purpose-context-relationships.mjs
      - name: Test Purpose Context workspace boundary attacks
        run: node scripts/test-purpose-context-workspace-boundary.mjs
      - name: Test Purpose Context explicit explain traversal
        run: node scripts/test-purpose-context-explain.mjs
      - name: Test Purpose Data current-value source ownership boundary
        run: node scripts/test-purpose-data-current-value-boundary.mjs
      - name: Test Purpose Data relevant current-state projection
        run: node scripts/test-purpose-data-current-state.mjs
      - name: Test Purpose Data exact-source descent
        run: node scripts/test-purpose-data-source-descent.mjs
      - name: Verify strategic writers and readers carry the ownership gates
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'assert-strategic-write --scope operator' system/capabilities/onboard/SKILL.md
          grep -Fq 'assert-strategic-write --scope <operator-or-workspace:id>' system/capabilities/level-up/SKILL.md
          grep -Fq 'assert-strategic-write --scope workspace:<id>' system/capabilities/workspace/SKILL.md
          grep -Fq 'current-context.mjs read --scope operator' AGENTS.md
          grep -Fq 'current-context.mjs read --scope workspace:<id>' AGENTS.md
          grep -Fq 'current_context_resolver: scripts/current-context.mjs' AI-VERSE.yaml
          grep -Fq '.aiverse/direction/' .gitignore
          test -f system/architecture/direction-ownership.md
          test -f system/architecture/purpose-context.md
          test -f system/schemas/purpose-context.schema.json
          test -f scripts/purpose-context.mjs
          test -f scripts/purpose-context-explain.mjs
          test -f scripts/purpose-data-current-value-boundary.mjs
          test -f scripts/purpose-data-current-state.mjs
      - name: Verify generated runtime peers remain canonical
        shell: bash
        run: |
          set -euo pipefail
          cmp system/capabilities/onboard/SKILL.md .claude/skills/onboard/SKILL.md
          cmp system/capabilities/onboard/SKILL.md .agents/skills/onboard/SKILL.md
          cmp system/capabilities/level-up/SKILL.md .claude/skills/level-up/SKILL.md
          cmp system/capabilities/level-up/SKILL.md .agents/skills/level-up/SKILL.md
          cmp system/capabilities/workspace/SKILL.md .claude/skills/workspace/SKILL.md
          cmp system/capabilities/workspace/SKILL.md .agents/skills/workspace/SKILL.md
          node scripts/sync-runtime-adapters.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
